<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speed Daemon</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header class="topbar">
      <form id="add-form" class="add-form">
        <input id="f-label" placeholder="label" size="10" />
        <input id="f-host" placeholder="host or IP" size="16" required />
        <input id="f-tag" placeholder="tag" size="8" list="tag-options" />
        <button type="submit">add</button>
      </form>
      <span id="window-range" class="window-range"></span>
      <span id="mode-badge" class="mode-badge">client</span>
      <button id="net-btn" class="icon-btn" title="Network">🛰</button>
      <button id="settings-btn" class="icon-btn" title="Thresholds">⚙</button>
    </header>

    <div class="controls">
      <div id="ranges" class="ranges"></div>
      <div id="scrub" class="scrub" title="Drag to scroll through history">
        <div id="scrub-thumb" class="scrub-thumb"></div>
      </div>
      <button id="pause-btn" class="live-btn" title="Pause (freeze view)">⏸</button>
      <button id="live-btn" class="live-btn" title="Jump to live">● live</button>
    </div>

    <main id="rows" class="rows"></main>

    <section id="remote-section" class="remote-section" hidden>
      <div class="remote-head">
        <span class="remote-title">remote</span>
        <label>source
          <select id="r-filter"><option value="">all</option></select>
        </label>
        <label>sort
          <select id="r-sort">
            <option value="source">source</option>
            <option value="name">name</option>
            <option value="rtt">rtt</option>
            <option value="loss">loss</option>
          </select>
        </label>
      </div>
      <div id="remote-rows" class="rows"></div>
    </section>

    <datalist id="tag-options"></datalist>

    <!-- edit pop-up -->
    <div id="editor" class="modal" hidden>
      <div class="dialog">
        <h2>Edit target</h2>
        <label>Label <input id="m-label" /></label>
        <label>Host / IP <input id="m-host" /></label>
        <label>Tag <input id="m-tag" list="tag-options" /></label>
        <label>Delay <span class="unit">ms between probes</span>
          <input id="m-interval" type="number" min="200" step="100" />
        </label>
        <div class="dialog-actions">
          <button id="m-remove" class="danger" type="button">Remove</button>
          <span class="spacer"></span>
          <button id="m-cancel" type="button">Cancel</button>
          <button id="m-save" class="primary" type="button">Save</button>
        </div>
      </div>
    </div>

    <!-- thresholds settings pop-up -->
    <div id="settings" class="modal" hidden>
      <div class="dialog wide">
        <h2>Settings</h2>
        <div class="theme-row">
          <span>Theme</span>
          <label><input type="radio" name="theme" value="system" /> System</label>
          <label><input type="radio" name="theme" value="light" /> Light</label>
          <label><input type="radio" name="theme" value="dark" /> Dark</label>
        </div>
        <h3 class="sub">Response-time thresholds (ms)</h3>
        <div class="thresh-grid">
          <span></span>
          <span class="th-head">good</span>
          <span class="th-head">ok</span>
          <span class="th-head">bad</span>
          <span class="th-head">max</span>

          <label class="th-row">LAN</label>
          <input id="s-lan-good" type="number" min="1" step="1" />
          <input id="s-lan-ok" type="number" min="1" step="1" />
          <input id="s-lan-bad" type="number" min="1" step="1" />
          <input id="s-lan-max" type="number" min="1" step="1" />

          <label class="th-row">WAN</label>
          <input id="s-wan-good" type="number" min="1" step="1" />
          <input id="s-wan-ok" type="number" min="1" step="1" />
          <input id="s-wan-bad" type="number" min="1" step="1" />
          <input id="s-wan-max" type="number" min="1" step="1" />

          <label class="th-row">Internet</label>
          <input id="s-inet-good" type="number" min="1" step="1" />
          <input id="s-inet-ok" type="number" min="1" step="1" />
          <input id="s-inet-bad" type="number" min="1" step="1" />
          <input id="s-inet-max" type="number" min="1" step="1" />
        </div>
        <p class="hint">Gateway follows LAN. “max” is the graph ceiling — higher values clip to full height.</p>
        <div class="dialog-actions">
          <button id="s-reset" type="button">Reset to defaults</button>
          <span class="spacer"></span>
          <button id="s-cancel" type="button">Cancel</button>
          <button id="s-save" class="primary" type="button">Save</button>
        </div>
      </div>
    </div>

    <!-- network pop-up -->
    <div id="network" class="modal" hidden>
      <div class="dialog wide">
        <h2>Network</h2>
        <label>This machine
          <input id="n-name" placeholder="name" />
        </label>
        <div class="mode-row">
          <span>Mode</span>
          <label><input type="radio" name="mode" value="client" /> Client</label>
          <label><input type="radio" name="mode" value="server" /> Server</label>
        </div>

        <div id="server-pane" hidden>
          <div class="net-head">
            <span>Discovered clients</span>
            <button id="n-discover" type="button">Scan</button>
          </div>
          <div id="n-discovered" class="net-list"></div>
        </div>

        <div class="net-head"><span>Paired</span></div>
        <div id="n-peers" class="net-list"></div>

        <div class="dialog-actions">
          <span class="spacer"></span>
          <button id="n-close" class="primary" type="button">Close</button>
        </div>
      </div>
    </div>

    <!-- incoming invite dialog (client) -->
    <div id="invite" class="modal" hidden>
      <div class="dialog">
        <h2>Pairing invitation</h2>
        <p id="inv-text"></p>
        <p class="warn">⚠ Do not accept unexpected invitations.</p>
        <p class="hint" id="inv-timer"></p>
        <div class="dialog-actions">
          <button id="inv-decline" class="danger" type="button">Decline</button>
          <span class="spacer"></span>
          <button id="inv-accept" class="primary" type="button">Accept</button>
        </div>
      </div>
    </div>
  </body>
</html>
