[package]
name = "speed-daemon"
version = "0.1.0"
description = "Home network probe dashboard"
authors = ["Avram Dorfman"]
edition = "2021"
# Two binaries now: the Tauri GUI (src/main.rs, this package's name) and the headless poller
# daemon `speedd` (src/bin/speedd.rs). `tauri dev`/`cargo run` default to the GUI.
default-run = "speed-daemon"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "speed_daemon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"] }
toml = "1.1.2"
anyhow = "1.0.102"
socket2 = "0.6.4"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.10.1"
gethostname = "1.1.0"
if-addrs = "0.15.0"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.2"
libc = "0.2.186"

